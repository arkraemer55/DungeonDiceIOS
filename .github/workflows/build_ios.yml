name: Build iOS App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Homebrew Dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install autoconf automake libtool pkg-config cmake || true
          brew uninstall --ignore-dependencies pbzip2 || true

      - name: Install Python Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "cython<3.0" setuptools wheel packaging kivy-ios

      - name: Build Python & Kivy Recipes
        run: |
          toolchain build python3 kivy

      - name: Create Xcode Project
        run: |
          toolchain create DungeonDice .

      - name: Build iOS Xcode Project & Create IPA
        run: |
          cd dungeondice-ios

          # Compile for physical arm64 iOS devices
          xcodebuild -project DungeonDice.xcodeproj \
                     -scheme dungeondice \
                     -configuration Release \
                     -sdk iphoneos \
                     IPHONEOS_DEPLOYMENT_TARGET=13.0 \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build
                     
          # Package into standard .ipa payload structure for AltStore
          mkdir -p Payload
          cp -r build/Release-iphoneos/dungeondice.app Payload/
          zip -r DungeonDice.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DungeonDice-iOS-IPA
          path: dungeondice-ios/DungeonDice.ipa
