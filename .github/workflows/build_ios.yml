name: Build iOS App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14 # Uses Apple Silicon M1 cloud runner with Xcode

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Homebrew Dependencies
        run: |
          brew install autoconf automake libtool pkg-config

      - name: Install kivy-ios
        run: |
          python -m pip install --upgrade pip
          pip install kivy-ios

      - name: Build Python & Kivy Recipes
        run: |
          toolchain build python3 kivy

      - name: Create Xcode Project
        run: |
          toolchain create DungeonDice .

      - name: Build iOS Xcode Project
        run: |
          cd dungeondice-ios
          xcodebuild -project DungeonDice.xcodeproj \
                     -scheme dungeondice \
                     -configuration Debug \
                     -sdk iphonesimulator \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DungeonDice-iOS-Simulator
          path: dungeondice-ios/build/Release-iphonesimulator/dungeondice.app
